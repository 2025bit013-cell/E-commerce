<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kihumuro Market | Customer Portal</title>
  <style>
    :root { --deep: #174734; --lime: #b8d64b; --ink: #17231d; --muted: #64748b; --line: #d8e1dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding-bottom: 76px; font-family: Arial, sans-serif; color: var(--ink); background: #f4f7f4; }
    .navbar { background: white; border-bottom: 1px solid var(--line); }
    .container { width: min(1100px, calc(100% - 32px)); margin: auto; }
    .navinner { min-height: 68px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { color: var(--deep); font-weight: 700; font-size: 19px; text-decoration: none; display: flex; align-items: center; gap: 9px; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--lime); }
    .navlinks { display: flex; gap: 20px; flex-wrap: wrap; }
    .navlinks a { color: #475569; text-decoration: none; font-size: 14px; }
    main { text-align: center; padding-top: 36px; }
    .login-form-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 30px; max-width: 460px; margin: 0 auto; box-shadow: 0 8px 28px #173c2b0b; }
    h1 { font-size: 25px; margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin: 0 0 22px; font-size: 14px; line-height: 1.5; }
    .role-tabs, .mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .role-tab, .mode-tab { flex: 1; background: transparent; border: 0; padding: 10px 8px; font-weight: 600; cursor: pointer; color: #64748b; border-radius: 6px; }
    .role-tab.active-tab, .mode-tab.active-tab { background: var(--deep); color: white; }
    .mode-tabs { background: #f1f5f3; padding: 4px; border: 0; border-radius: 8px; margin-bottom: 20px; }
    .mode-tabs .mode-tab.active-tab { background: white; color: var(--deep); box-shadow: 0 1px 4px #0002; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 14px; font-weight: 600; }
    .form-group input { padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; width: 100%; }
    .form-group input:focus { outline: 2px solid #b8d64b; border-color: var(--deep); }
    .btn { border: 0; border-radius: 6px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--deep); color: white; width: 100%; margin-top: 5px; }
    .btn-primary:hover { background: #0f3827; }
    .message { display: none; text-align: left; font-size: 14px; line-height: 1.5; padding: 11px 12px; border-radius: 6px; margin: 0 0 16px; }
    .message.error { display: block; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; }
    .message.success { display: block; color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }
    .info-hint-box { font-size: 12px; background: #f8fafc; border-left: 3px solid var(--lime); padding: 10px; margin-top: 16px; color: #475569; text-align: left; line-height: 1.5; }
    .foot { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid var(--line); padding: 18px 0; color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { .navinner { align-items: flex-start; flex-direction: column; padding: 14px 0; } .navlinks { gap: 13px; } .login-form-panel { padding: 22px 18px; } main { padding-top: 24px; } }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container navinner">
      <a class="brand" href="index.html"><span class="brand-mark">K</span>Kihumuro Market</a>
      <nav class="navlinks" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="categories.html">Categories</a><a href="products.html">Products</a><a href="myorders.html">My Orders</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="login-form-panel" aria-labelledby="portal-title">
      <h1 id="portal-title">Customer access</h1>
      <p class="subtitle">Create an account to get started, or sign in to your active account.</p>

      <div class="role-tabs" aria-label="Account type">
        <button class="role-tab active-tab" type="button" data-role="Customer" aria-pressed="true">Customer</button>
        <button class="role-tab" type="button" data-role="Supplier" aria-pressed="false">Supplier</button>
        <button class="role-tab" type="button" data-role="Administrator" aria-pressed="false">Admin</button>
      </div>

      <div class="mode-tabs" id="customer-modes" aria-label="Customer account action">
        <button class="mode-tab active-tab" type="button" data-mode="login" aria-pressed="true">Sign in</button>
        <button class="mode-tab" type="button" data-mode="register" aria-pressed="false">Create account</button>
      </div>

      <div id="form-message" class="message" role="status" aria-live="polite"></div>
      <form id="account-form" novalidate>
        <div class="form-group" id="name-group" hidden>
          <label for="customer-name">Full name</label>
          <input type="text" id="customer-name" name="name" autocomplete="name" placeholder="e.g., Amina Nuwagaba">
        </div>
        <div class="form-group">
          <label id="email-label" for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
        </div>
        <div class="form-group" id="confirm-group" hidden>
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Enter the password again">
        </div>
        <button class="btn btn-primary" id="submit-button" type="submit">Sign in</button>
      </form>
      <div class="info-hint-box" id="hint-msg"><strong>Customer access:</strong> Use your email and password to manage orders and track their status.</div>
    </section>
  </main>
  <footer class="foot"><div class="container">© 2026 Kihumuro Market · Customer Portal</div></footer>

  <script>
    // Front-end demonstration only. Production authentication must use a secure server and database.
    const STORAGE_KEY = 'kihumuro-market-demo-customers';
    let activeRole = 'Customer';
    let activeMode = 'login';
    const form = document.getElementById('account-form');
    const message = document.getElementById('form-message');
    const nameInput = document.getElementById('customer-name');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');

    function readCustomers() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function showMessage(text, kind) {
      message.textContent = text;
      message.className = 'message ' + kind;
    }
    function clearMessage() {
      message.textContent = '';
      message.className = 'message';
    }
    function setMode(mode) {
      activeMode = mode;
      clearMessage();
      document.querySelectorAll('.mode-tab').forEach(button => {
        const selected = button.dataset.mode === mode;
        button.classList.toggle('active-tab', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      const registering = mode === 'register';
      document.getElementById('name-group').hidden = !registering;
      document.getElementById('confirm-group').hidden = !registering;
      nameInput.required = registering;
      confirmInput.required = registering;
      passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
      document.getElementById('submit-button').textContent = registering ? 'Create customer account' : 'Sign in';
      document.getElementById('portal-title').textContent = registering ? 'Create your account' : 'Customer sign in';
      document.querySelector('.subtitle').textContent = registering
        ? 'Register with your name, email address and a password to get started.'
        : 'Sign in with the email and password for your active account.';
    }
    document.querySelectorAll('.mode-tab').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));

    document.querySelectorAll('.role-tab').forEach(button => button.addEventListener('click', () => {
      activeRole = button.dataset.role;
      document.querySelectorAll('.role-tab').forEach(tab => {
        const selected = tab === button;
        tab.classList.toggle('active-tab', selected);
        tab.setAttribute('aria-pressed', String(selected));
      });
      clearMessage();
      const isCustomer = activeRole === 'Customer';
      document.getElementById('customer-modes').hidden = !isCustomer;
      document.getElementById('name-group').hidden = !isCustomer || activeMode !== 'register';
      document.getElementById('confirm-group').hidden = !isCustomer || activeMode !== 'register';
      nameInput.required = isCustomer && activeMode === 'register';
      confirmInput.required = isCustomer && activeMode === 'register';
      document.getElementById('portal-title').textContent = isCustomer ? (activeMode === 'register' ? 'Create your account' : 'Customer sign in') : activeRole + ' sign in';
      document.querySelector('.subtitle').textContent = isCustomer
        ? (activeMode === 'register' ? 'Register with your name, email address and a password to get started.' : 'Sign in with the email and password for your active account.')
        : 'Enter your authorized ' + activeRole.toLowerCase() + ' credentials to continue.';
      document.getElementById('email-label').textContent = isCustomer ? 'Email address' : activeRole + ' ID or email';
      document.getElementById('email').placeholder = isCustomer ? 'you@example.com' : 'Enter your ' + activeRole.toLowerCase() + ' ID or email';
      document.getElementById('email').type = isCustomer ? 'email' : 'text';
      document.getElementById('submit-button').textContent = isCustomer && activeMode === 'register' ? 'Create customer account' : 'Sign in';
      document.getElementById('hint-msg').innerHTML = isCustomer
        ? '<strong>Customer access:</strong> Use your email and password to manage orders and track their status.'
        : '<strong>' + activeRole + ' access:</strong> Sign-in for this role must be connected to your organization’s authentication service.';
    }));

    form.addEventListener('submit', event => {
      event.preventDefault();
      clearMessage();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = passwordInput.value;
      if (!email || !password) return showMessage('Enter your email and password to continue.', 'error');

      if (activeRole !== 'Customer') {
        return showMessage('Supplier and administrator sign-in needs to be connected to the system’s authentication service.', 'error');
      }

      const customers = readCustomers();
      if (activeMode === 'register') {
        const name = nameInput.value.trim();
        if (!name) return showMessage('Enter your full name.', 'error');
        if (password.length < 8) return showMessage('Choose a password with at least 8 characters.', 'error');
        if (password !== confirmInput.value) return showMessage('The passwords do not match. Please try again.', 'error');
        if (customers.some(customer => customer.email === email)) {
          setMode('login');
          return showMessage('An account already exists for this email. Sign in with your password instead.', 'error');
        }
        customers.push({ name, email, password, status: 'active', createdAt: new Date().toISOString() });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(customers)); }
        catch { return showMessage('This browser could not save the account. Please enable local storage or connect a secure account service.', 'error'); }
        form.reset();
        setMode('login');
        return showMessage('Your customer account has been created. You can now sign in.', 'success');
      }

      const customer = customers.find(entry => entry.email === email && entry.status === 'active');
      if (!customer || customer.password !== password) {
        return showMessage('We could not find an active account with those details. Check your email and password, or create an account.', 'error');
      }
      sessionStorage.setItem('kihumuro-market-demo-session', JSON.stringify({ email: customer.email, name: customer.name }));
      showMessage('Welcome back, ' + customer.name + '! You are signed in.', 'success');
    });
  </script>
</body>
</html>
